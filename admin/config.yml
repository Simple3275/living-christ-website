# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: Simple3275/living-christ-website
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/cc534004-48d9-4de5-b148-7b1e34f25190/pkce
  auth_token_endpoint: /sites/cc534004-48d9-4de5-b148-7b1e34f25190/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://living-christ-website.vercel.app

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "events_data"
    label: "Upcoming Events"
    files:
      - file: "content/events.json"
        label: "Events List"
        name: "events"
        fields:
          - label: "Events"
            name: "items"
            widget: "list"
            fields:
              - { label: "Event Title", name: "title", widget: "string" }
              - { label: "Category", name: "category", widget: "string" }
              - { label: "Event Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
              - { label: "Time Description", name: "time", widget: "string" }
              - { label: "Location", name: "location", widget: "string" }
              - { label: "Short Description", name: "description", widget: "text" }
              
  - name: "sermons_data"
    label: "Sermons & Messages"
    files:
      - file: "content/sermons.json"
        label: "Sermons List"
        name: "sermons"
        fields:
          - label: "Sermons"
            name: "items"
            widget: "list"
            fields:
              - { label: "Sermon Title", name: "title", widget: "string" }
              - { label: "Preacher / Speaker", name: "preacher", widget: "string" }
              - { label: "Date Preached", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
              - { label: "Category", name: "category", widget: "string", required: false }
              - { label: "Audio URL (MP3)", name: "audioUrl", widget: "string", required: false }
              - { label: "Summary / Notes", name: "description", widget: "text", required: false }

  - name: "settings"
    label: "Site Content"
    files:
      - file: "content/settings/pastors.json"
        label: "Lead Pastors Profile"
        name: "pastors"
        fields:
          - { label: "Names", name: "names", widget: "string", default: "Pastor [Name] & Pastor (Mrs) [Name]" }
          - { label: "Title / Role", name: "title", widget: "string", default: "Lead Pastors" }
          - { label: "Joint Photo", name: "photo", widget: "image" }
          - { label: "Biography", name: "bio", widget: "text" }